name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI solo lee el repositorio. No puede solicitar tokens OIDC ni modificar AWS.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap
          - staging
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}

    steps:
      # Descarga el commit exacto que se está evaluando sin conservar las
      # credenciales de GitHub en el directorio de trabajo.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Fija la misma versión de Terraform utilizada durante el desarrollo.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.6"

      # Comprueba el formato estándar sin modificar ningún archivo.
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      # Descarga los providers fijados por cada lock file. No conecta con el
      # estado real ni recibe credenciales AWS.
      - name: Initialize Terraform without a backend
        run: terraform init -backend=false -input=false

      # Valida sintaxis, tipos y relaciones entre los recursos declarados.
      - name: Validate Terraform
        run: terraform validate -no-color

  maven:
    name: Maven (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database:
          - h2
          - mysql

    steps:
      # Cada variante obtiene una copia limpia del mismo commit.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Instala Java 21 y reutiliza la caché de dependencias Maven.
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Garantiza que Linux pueda ejecutar el Maven Wrapper del repositorio.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # Ejecuta la suite rápida con H2 únicamente en su variante de matriz.
      - name: Verify with H2
        if: matrix.database == 'h2'
        run: ./mvnw -B -ntp clean verify

      # Usa Testcontainers con MySQL para validar Flyway, JPA y consultas sobre
      # el mismo motor que utiliza la aplicación desplegada.
      - name: Verify with MySQL and Testcontainers
        if: matrix.database == 'mysql'
        run: ./mvnw -B -ntp clean verify -Pmysql-it

  docker:
    name: Docker image
    needs: maven
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Los jobs son aislados; descarga nuevamente el commit ya probado.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Activa el builder moderno y la caché compartida de GitHub Actions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Verifica el Dockerfile y el empaquetado. push:false garantiza que CI no
      # publica imágenes ni contacta con AWS.
      - name: Build application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: nitros-games-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
