name: CD - Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA from main already published to ECR
        required: true
        type: string

permissions:
  contents: read

# Deploy, start, stop, restore and hibernate are mutually exclusive production
# control-plane operations. A second workflow waits instead of racing Terraform.
concurrency:
  group: production-control
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      # Obtiene las guardias versionadas desde main sin solicitar credenciales
      # AWS ni entrar todavía en el Environment protegido.
      - name: Check out workflow safeguards
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Rechaza una ejecución desde otra rama o un identificador mutable.
      - name: Validate workflow context and full SHA
        shell: bash
        run: |
          set -euo pipefail
          source deploy/production/release_guard.sh
          production_cd_require_main_ref "$GITHUB_REF"
          production_cd_require_full_sha "$REQUESTED_SHA"

      # Demuestra que el SHA pertenece a main y que su CI de push terminó bien.
      - name: Verify commit belongs to main and passed CI
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source deploy/production/release_guard.sh
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${REQUESTED_SHA}...main" --jq '.status')"
          production_cd_require_main_membership "$comparison"
          ci_conclusion="$(gh run list \
            --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$REQUESTED_SHA" --event push --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')"
          production_cd_require_successful_ci "$ci_conclusion"
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy production through SSM
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://api.nitrosgames64.com
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
      IMAGE_SHA: ${{ needs.preflight.outputs.commit_sha }}

    steps:
      # Descarga exactamente el commit aprobado. El bundle debe coincidir con
      # la revisión usada para construir la imagen inmutable.
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.IMAGE_SHA }}
          persist-credentials: false

      # Comprueba inputs, scripts, binding de red y finales LF antes de AWS.
      - name: Validate production bundle and variables
        shell: bash
        env:
          AWS_PRODUCTION_DEPLOY_ROLE_ARN: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          source deploy/production/release_guard.sh
          production_cd_require_main_ref "$GITHUB_REF"
          production_cd_require_full_sha "$IMAGE_SHA"
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"
          test -n "$AWS_PRODUCTION_DEPLOY_ROLE_ARN"
          bash -n deploy/production/deploy.sh
          bash -n deploy/production/deploy-via-ssm.sh
          bash -n deploy/production/lifecycle.sh
          bash -n deploy/production/verify-restored-db.sh
          grep -qx '      - 8080:8080' deploy/production/compose.yaml
          ! grep -q '127\.0\.0\.1:8080:8080' deploy/production/compose.yaml
          if grep -q $'\r' deploy/production/compose.yaml deploy/production/*.sh; then
            echo "Production deployment files must use LF line endings." >&2
            exit 65
          fi

      # El Environment production produce el subject OIDC exacto y AWS entrega
      # credenciales efímeras al rol de despliegue, no al rol de ciclo de vida.
      - name: Configure AWS production credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-production-${{ github.run_id }}
          mask-aws-account-id: true

      # desiredState debe ser ACTIVE. La EC2 se descubre por cuatro tags; ya no
      # existe un ID de instancia estático que pueda quedar obsoleto.
      - name: Verify immutable image and discover production target
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source deploy/production/lifecycle.sh
          lifecycle="$(production_read_lifecycle_state)"
          production_require_desired_state ACTIVE "$lifecycle"
          instance_id="$(production_require_single_instance)"
          [[ "$(production_instance_state "$instance_id")" == "running" ]] || {
            echo "Production EC2 must be running before deployment." >&2
            exit 71
          }
          production_wait_for_ssm_online "$instance_id" 1
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          app_image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_SHA}"
          image_digest="$(production_require_ecr_image "$ECR_REPOSITORY" "$IMAGE_SHA")"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "image=$app_image" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      # Transporta Compose y scripts operativos. deploy.sh conserva readiness y
      # rollback; runtime.env y credenciales nunca salen de la instancia.
      - name: Synchronize bundle and deploy immutable image
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.release.outputs.instance_id }}
          APP_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          deploy/production/deploy-via-ssm.sh "$INSTANCE_ID" "$APP_IMAGE" "$AWS_REGION"

      # Demuestra desde Internet ALB/TLS/readiness y un GET público sin ADMIN.
      - name: Verify public readiness and API smoke test
        shell: bash
        run: |
          set -euo pipefail
          source deploy/production/release_guard.sh
          readiness_body="$(mktemp)"
          trap 'rm -f "$readiness_body"' EXIT
          readiness_status="$(curl --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 \
            --output "$readiness_body" --write-out '%{http_code}' \
            https://api.nitrosgames64.com/actuator/health/readiness || true)"
          smoke_status="$(curl --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 \
            --output /dev/null --write-out '%{http_code}' \
            https://api.nitrosgames64.com/api/v1/game-genres || true)"
          production_cd_require_http_200 "Public readiness" "$readiness_status"
          jq --exit-status '.status == "UP"' "$readiness_body" >/dev/null
          production_cd_require_http_200 "Public API smoke test" "$smoke_status"

      # El rol de deploy actualiza release solo después de éxito. No posee
      # PutParameter sobre el estado de infraestructura.
      - name: Record successful release metadata
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          source deploy/production/lifecycle.sh
          production_write_release_metadata "$IMAGE_SHA" "$IMAGE_DIGEST"
          echo "Production release metadata now references $IMAGE_SHA." >> "$GITHUB_STEP_SUMMARY"
