spring.datasource.url=jdbc:h2:mem:nitrosgames;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Fast tests keep using Hibernate/H2. MySQL migrations are exercised by MySqlMigrationIT.
spring.flyway.enabled=false

logging.level.org.hibernate.SQL=OFF

app.storage.host-images.backend=filesystem
app.storage.host-images.directory=target/test-storage/host-images

app.security.allowed-origins=http://localhost:4200

app.security.jwt.issuer-uri=https://issuer.example.test/realms/nitros-games
app.security.jwt.jwk-set-uri=https://issuer.example.test/realms/nitros-games/protocol/openid-connect/certs
app.security.jwt.resource-id=nitros-games-api
app.security.jwt.access-scope=nitros-games-api/access
app.security.jwt.admin-scope=nitros-games-api/admin
app.security.jwt.allowed-client-ids=nitros-games-web,nitros-games-cli,nitros-games-reader-cli
