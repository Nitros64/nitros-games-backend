spring.application.name=nitros-games-backend

# Safe defaults shared by every non-test environment.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# Expose only health information. Readiness includes the database dependency;
# liveness intentionally does not, so a database outage does not cause restart loops.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.validate-migration-naming=true

spring.servlet.multipart.max-file-size=${APP_STORAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_STORAGE_MAX_REQUEST_SIZE:11MB}
app.storage.host-images.max-file-size=${APP_STORAGE_MAX_FILE_SIZE:10MB}
