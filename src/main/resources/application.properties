spring.application.name=nitros-games-backend

# SETTINGS MySQL 9.x Database Configuration
spring.datasource.url = jdbc:mysql://localhost:3306/nitrosgames?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.root=root
spring.datasource.username=nitros
spring.datasource.password=12345678
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# JPA and Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Connection Pooling (HikariCP - Default in Spring Boot 3)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariPool

