spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Emit one JSON object per line. MDC fields such as requestId are included by
# Spring Boot's Logstash structured-log format.
logging.structured.format.console=logstash
logging.level.root=${APP_LOG_LEVEL:INFO}

# Publish latency buckets so Prometheus can calculate request-duration SLOs.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Existing production schemas must be baselined as an explicit deployment action.
spring.flyway.baseline-on-migrate=false

spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.pool-name=NitrosGamesPool

# Production must mount and explicitly select a persistent writable directory.
app.storage.host-images.directory=${APP_STORAGE_HOST_IMAGES_DIRECTORY}

app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.audiences[0]=${OAUTH2_AUDIENCE}
