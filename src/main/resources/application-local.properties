spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nitrosgames?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:nitros}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Existing local databases are adopted at V1; new databases execute V1 normally.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariPool

app.storage.host-images.backend=${APP_STORAGE_HOST_IMAGES_BACKEND:filesystem}
app.storage.host-images.directory=${APP_STORAGE_HOST_IMAGES_DIRECTORY:uploadImageFileHost}

app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:4200}

app.security.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:8081/realms/nitros-games}
app.security.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI:http://localhost:8081/realms/nitros-games/protocol/openid-connect/certs}
app.security.jwt.resource-id=${OAUTH2_RESOURCE_ID:nitros-games-api}
app.security.jwt.access-scope=${OAUTH2_ACCESS_SCOPE:nitros-games-api/access}
app.security.jwt.admin-scope=${OAUTH2_ADMIN_SCOPE:nitros-games-api/admin}
app.security.jwt.allowed-client-ids=${OAUTH2_ALLOWED_CLIENT_IDS:nitros-games-web,nitros-games-cli,nitros-games-reader-cli}
