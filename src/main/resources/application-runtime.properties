spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Emit one JSON object per line. MDC fields such as requestId are included by
# Spring Boot's Logstash structured-log format.
logging.structured.format.console=logstash
logging.level.root=${APP_LOG_LEVEL:INFO}

# Publish latency buckets so Prometheus can calculate request-duration SLOs.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Existing deployed schemas must be baselined as an explicit deployment action.
spring.flyway.baseline-on-migrate=false

spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.pool-name=NitrosGamesPool

# Filesystem is the default for deployed runtimes. Production selects S3
# explicitly through its runtime environment.
app.storage.host-images.backend=${APP_STORAGE_HOST_IMAGES_BACKEND:filesystem}
app.storage.host-images.directory=${APP_STORAGE_HOST_IMAGES_DIRECTORY:uploadImageFileHost}
app.storage.host-images.s3.bucket=${APP_STORAGE_HOST_IMAGES_S3_BUCKET:}
app.storage.host-images.s3.region=${AWS_REGION:}
app.storage.host-images.s3.prefix=${APP_STORAGE_HOST_IMAGES_S3_PREFIX:host-images/}

app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS}

app.security.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
app.security.jwt.jwk-set-uri=${OAUTH2_JWK_SET_URI}
app.security.jwt.resource-id=${OAUTH2_RESOURCE_ID}
app.security.jwt.access-scope=${OAUTH2_ACCESS_SCOPE}
app.security.jwt.admin-scope=${OAUTH2_ADMIN_SCOPE}
app.security.jwt.allowed-client-ids=${OAUTH2_ALLOWED_CLIENT_IDS}
